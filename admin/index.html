<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="manifest" href="../manifest.json">
    <link rel="apple-touch-icon" href="../assets/icons/icon-192.png">
    <title>drillFlow — Administration des signalements</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css?v=127">
    <style>
        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-family: var(--font-sans);
            padding: 2rem 2.5rem;
            width: 100%;
            max-width: 100%;
            margin: 0;
            box-sizing: border-box;
        }
        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            flex-wrap: wrap;
            gap: 1rem;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 1rem;
        }
        .admin-title {
            font-family: var(--font-heading);
            font-size: 1.8rem;
            margin: 0;
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }
        .admin-badge {
            background: rgba(239, 68, 68, 0.2);
            color: var(--error-color);
            font-size: 0.8rem;
            padding: 0.2rem 0.6rem;
            border-radius: 6px;
            font-weight: 600;
        }
        .report-table-container {
            background: var(--surface-color);
            border-radius: 12px;
            border: 1px solid var(--border-color);
            overflow-x: auto;
            box-shadow: var(--shadow);
        }
        table.admin-table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 0.95rem;
        }
        table.admin-table th, table.admin-table td {
            padding: 1rem 1.25rem;
            border-bottom: 1px solid var(--border-color);
        }
        table.admin-table th {
            background: rgba(255, 255, 255, 0.03);
            font-weight: 600;
            color: var(--text-secondary);
            text-transform: uppercase;
            font-size: 0.75rem;
            letter-spacing: 0.5px;
        }
        table.admin-table tr:last-child td {
            border-bottom: none;
        }
        .count-badge {
            background: var(--error-color);
            color: white;
            font-weight: bold;
            padding: 0.25rem 0.65rem;
            border-radius: 20px;
            font-size: 0.85rem;
            display: inline-block;
        }
        .btn-resolve {
            background: rgba(16, 185, 129, 0.15);
            color: var(--success-color);
            border: 1px solid var(--success-color);
            padding: 0.35rem 0.75rem;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.85rem;
            transition: all 0.2s ease;
        }
        .btn-resolve:hover {
            background: var(--success-color);
            color: white;
        }
        .empty-state {
            padding: 3rem;
            text-align: center;
            color: var(--text-secondary);
        }
    </style>
</head>
<body>
    <div class="admin-header">
        <div>
            <h1 class="admin-title">
                drillFlow. <span class="admin-badge">ADMINISTRATION</span>
            </h1>
            <p style="color: var(--text-secondary); font-size: 0.9rem; margin-top: 0.35rem;">Mots signalés comme mal traduits par les utilisateurs</p>
        </div>
        <div style="display: flex; gap: 0.75rem; align-items: center;">
            <button id="btn-refresh-admin" class="btn-primary btn-secondary-action" style="padding: 0.6rem 1.25rem; font-size: 0.9rem; height: 42px; display: inline-flex; align-items: center; justify-content: center; box-sizing: border-box;">Rafraîchir</button>
            <a href="../config/" class="btn-primary btn-secondary-action" style="padding: 0.6rem 1.25rem; font-size: 0.9rem; height: 42px; display: inline-flex; align-items: center; justify-content: center; text-decoration: none; box-sizing: border-box;">⚙️ Configuration</a>
            <a href="../index.html" class="btn-primary" style="padding: 0.6rem 1.25rem; font-size: 0.9rem; height: 42px; display: inline-flex; align-items: center; justify-content: center; text-decoration: none; box-sizing: border-box;">Accéder au site</a>
        </div>
    </div>

    <div class="report-table-container">
        <div id="loading-state" style="padding: 3rem; text-align: center; color: var(--text-secondary);">
            Chargement des signalements depuis Firebase...
        </div>
        <table id="reports-table" class="admin-table" style="display: none;">
            <thead>
                <tr>
                    <th>Signalements</th>
                    <th>Paire</th>
                    <th>Mot (FR)</th>
                    <th>Anglais (EN)</th>
                    <th>Allemand (DE)</th>
                    <th>Espagnol (ES)</th>
                    <th>Niveau</th>
                    <th>Type</th>
                    <th>Description / Remarques</th>
                    <th>Dernier signalement</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="reports-tbody">
                <!-- Rempli en JS -->
            </tbody>
        </table>
    </div>

    <script type="module" src="../js/admin.js?v=127"></script>
    <script>
        if ("serviceWorker" in navigator) {
            window.addEventListener("load", () => {
                navigator.serviceWorker.register("/service-worker.js");
            });
        }
    </script>
</body>
</html>
