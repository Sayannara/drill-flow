<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>drillFlow - Drill Lexical</title>
    <!-- Polices -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css?v=9">
    <link rel="icon" type="image/jpeg" href="favicon.jpg?v=3">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>
<body>
    <header class="app-header">
        <div class="logo" id="app-logo">
            <span class="logo-text">drillFlow.</span>
        </div>
        <nav class="nav-menu">
            <button id="nav-home" class="nav-btn active" data-i18n="nav_drill">Drill !</button>
            <button id="nav-progress" class="nav-btn" data-i18n="nav_progress">Mes mots</button>
            <button id="nav-stats" class="nav-btn" data-i18n="nav_stats">Statistiques</button>
            <button id="nav-certs" class="nav-btn" data-i18n="nav_certs">Certificats</button>
            <button id="nav-about" class="nav-btn" data-i18n="nav_about">Démarche Projet</button>
        </nav>
        <div class="header-actions">
            <select id="app-lang-select" title="Changer la langue de l'application" style="width: auto; padding: 0.35rem 0.6rem; border-radius: 8px; font-weight: 600; font-size: 0.85rem; margin-right: 0.5rem; background: var(--surface-color); color: var(--text-primary); border: 1px solid var(--border-color); cursor: pointer; outline: none; font-family: var(--font-sans); transition: border-color 0.2s;">
                <option value="fr">FR</option>
                <option value="en">EN</option>
                <option value="de">DE</option>
                <option value="es">ES</option>
            </select>
            <button id="theme-toggle" class="icon-btn" title="Changer de thème">
                <span class="theme-icon">🌙</span>
            </button>
            <button id="menu-toggle" class="icon-btn mobile-menu-btn" title="Menu">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="1"></circle><circle cx="19" cy="12" r="1"></circle><circle cx="5" cy="12" r="1"></circle></svg>
            </button>
        </div>
    </header>

    <main id="app-container">
        <!-- Les vues seront injectées ici par le routeur JS -->
    </main>

    <!-- Template Vue Accueil -->
    <template id="view-home">
        <div class="view-content animate-fade-in">
            <p id="home-intro-text" style="text-align: center; font-size: 1.15rem; color: var(--text-secondary); margin-bottom: 2.25rem; line-height: 1.6;"></p>
            <h1 class="page-title" data-i18n="title_home">Nouvelle session</h1>
            <p class="page-subtitle" style="margin-bottom: 1.5rem;">
                <span id="home-remaining-text">...</span>
            </p>
            
            <div class="card config-card">
                <div class="form-group">
                    <label data-i18n="label_source">Langue de départ (Source)</label>
                    <select id="select-lang-source">
                        <option value="fr" selected>Français (FR)</option>
                        <option value="en">Anglais (EN)</option>
                        <option value="de">Allemand (DE)</option>
                        <option value="es">Espagnol (ES)</option>
                    </select>
                </div>

                <div class="form-group">
                    <label data-i18n="label_target">Langue d'arrivée (Cible)</label>
                    <select id="select-lang-target">
                        <option value="fr">Français (FR)</option>
                        <option value="en" selected>Anglais (EN)</option>
                        <option value="de">Allemand (DE)</option>
                        <option value="es">Espagnol (ES)</option>
                    </select>
                </div>

                <div class="form-group">
                    <label data-i18n="label_level">Niveaux CECRL</label>
                    <div class="level-filter-group" style="display: flex; gap: 0.85rem; align-items: center; flex-wrap: wrap;" id="drill-level-checkboxes">
                        <label class="filter-checkbox-label" style="display: flex; align-items: center; gap: 0.4rem; cursor: pointer; user-select: none; margin: 0;">
                            <input type="checkbox" id="drill-level-a1" value="A1" checked style="accent-color: var(--primary-color); width: 15px; height: 15px; cursor: pointer;">
                            <span class="type-badge" style="font-size: 0.7rem; padding: 0.15rem 0.45rem; background: rgba(59, 130, 246, 0.2); color: #3b82f6;">A1</span>
                        </label>
                        <label class="filter-checkbox-label" style="display: flex; align-items: center; gap: 0.4rem; cursor: pointer; user-select: none; margin: 0;">
                            <input type="checkbox" id="drill-level-a2" value="A2" checked style="accent-color: var(--primary-color); width: 15px; height: 15px; cursor: pointer;">
                            <span class="type-badge" style="font-size: 0.7rem; padding: 0.15rem 0.45rem; background: rgba(16, 185, 129, 0.2); color: #10b981;">A2</span>
                        </label>
                        <label class="filter-checkbox-label" style="display: flex; align-items: center; gap: 0.4rem; cursor: pointer; user-select: none; margin: 0;">
                            <input type="checkbox" id="drill-level-b1" value="B1" checked style="accent-color: var(--primary-color); width: 15px; height: 15px; cursor: pointer;">
                            <span class="type-badge" style="font-size: 0.7rem; padding: 0.15rem 0.45rem; background: rgba(245, 158, 11, 0.2); color: #f59e0b;">B1</span>
                        </label>
                        <label style="display: flex; align-items: center; gap: 0.35rem; font-size: 0.9rem; cursor: pointer;">
                            <input type="checkbox" id="drill-level-b2" value="B2" checked style="accent-color: var(--primary-color); width: 15px; height: 15px; cursor: pointer;">
                            <span class="type-badge" style="font-size: 0.7rem; padding: 0.15rem 0.45rem; background: rgba(239, 68, 68, 0.2); color: #ef4444;">B2</span>
                        </label>
                        <label style="display: flex; align-items: center; gap: 0.35rem; font-size: 0.9rem; cursor: pointer;">
                            <input type="checkbox" id="drill-level-c1" value="C1" checked style="accent-color: var(--primary-color); width: 15px; height: 15px; cursor: pointer;">
                            <span class="type-badge" style="font-size: 0.7rem; padding: 0.15rem 0.45rem; background: rgba(139, 92, 246, 0.2); color: #8b5cf6;">C1</span>
                        </label>
                        <label style="display: flex; align-items: center; gap: 0.35rem; font-size: 0.9rem; cursor: pointer;">
                            <input type="checkbox" id="drill-level-c2" value="C2" checked style="accent-color: var(--primary-color); width: 15px; height: 15px; cursor: pointer;">
                            <span class="type-badge" style="font-size: 0.7rem; padding: 0.15rem 0.45rem; background: rgba(168, 85, 247, 0.2); color: #a855f7;">C2</span>
                        </label>
                    </div>
                </div>

                <div class="form-group">
                    <label data-i18n="label_volume">Nombre de mots</label>
                    <div class="range-container">
                        <input type="range" id="input-volume" min="5" max="20" value="20" step="5">
                        <span id="volume-display" class="badge">20 mots</span>
                    </div>
                </div>

                <button id="btn-start-session" class="btn-primary" data-i18n="btn_start_drill">Démarrer le Drill</button>
            </div>
        </div>
    </template>

    <!-- Template Vue Drill (Exercice) -->
    <template id="view-drill">
        <div class="view-content drill-container animate-slide-up">
            <div class="drill-header" id="drill-header-section">
                <div class="lang-pair">
                    <span id="drill-lang-source" class="lang-badge">FR</span>
                    <button id="btn-flip-lang" class="icon-btn" title="Inverser le sens">⇄</button>
                    <span id="drill-lang-target" class="lang-badge">EN</span>
                </div>
                <div class="drill-progress">
                    <span id="drill-counter">1 / 20</span>
                </div>
            </div>

            <div id="end-session-container" class="card" style="display: none; text-align: center; padding: 3rem 2rem; flex-direction: column; align-items: center; gap: 1.5rem;">
                <h2 style="font-family: var(--font-heading); font-size: 2.5rem; color: var(--success-color);" data-i18n="congrats">Félicitations ! 🎉</h2>
                <p style="color: var(--text-secondary); font-size: 1.1rem; margin-bottom: 1rem;" data-i18n="congrats_sub">Vous avez terminé tous les mots de cette session.</p>
                <button id="btn-new-batch" class="btn-primary" style="max-width: 250px;" data-i18n="btn_new_batch">Démarrer un nouveau lot</button>
            </div>

            <div class="flashcard">
                <!-- Wrapper dynamique à hauteur minimale fixe pour empêcher les boutons de sauter -->
                <div id="drill-dynamic-area" style="min-height: 380px; display: flex; flex-direction: column; justify-content: center;">
                    <!-- Zone de résultat et comparaison en HAUT -->
                    <div class="result-section hidden" id="drill-result" style="margin-top: 0; margin-bottom: 1.5rem;">
                        <div id="result-status" class="status-banner">Correct !</div>
                        
                        <div class="result-comparison">
                            <div class="comparison-line">
                                <span class="comparison-label" data-i18n="label_word">Mot:</span>
                                <span id="result-asked" class="comparison-text" style="color: var(--text-primary); font-weight: 500;">...</span>
                            </div>
                            <div class="comparison-line" id="result-user-container" style="display: none;">
                                <span class="comparison-label" data-i18n="label_user">Entré:</span>
                                <span id="result-user" class="comparison-text user-saisie">...</span>
                            </div>
                            <div class="comparison-line" id="result-expected-container">
                                <span class="comparison-label" data-i18n="label_expected">Attendu:</span>
                                <div style="display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap;">
                                    <span id="result-expected" class="comparison-text expected-saisie">...</span>
                                    <button id="btn-speak-expected" class="icon-btn speak-btn" title="Entendre la prononciation" style="margin-left: 0; display: inline-flex; align-items: center; justify-content: center; padding: 0.35rem;">
                                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                                            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
                                            <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path>
                                        </svg>
                                    </button>
                                </div>
                            </div>
                            <div class="comparison-line" id="example-correct-line" style="display: none; margin-top: 1.25rem; margin-bottom: 0.9rem;">
                                <span class="comparison-label"></span>
                                <span id="example-correct-text" style="font-style: italic; font-size: 1.05rem; color: var(--text-secondary); font-family: var(--font-sans); white-space: normal; line-height: 1.4; text-align: left;"></span>
                            </div>
                            <div class="comparison-line" id="rewrite-line" style="display: none;">
                                <span class="comparison-label" data-i18n="label_rewrite">Récrire:</span>
                                <input type="text" id="rewrite-input" class="comparison-text rewrite-field" placeholder="..." autocomplete="off">
                            </div>
                            <div class="comparison-line" id="example-incorrect-line" style="display: none; margin-top: 1.25rem; margin-bottom: 0.9rem;">
                                <span class="comparison-label"></span>
                                <span id="example-incorrect-text" style="font-style: italic; font-size: 1.05rem; color: var(--text-secondary); font-family: var(--font-sans); white-space: normal; line-height: 1.4; text-align: left;"></span>
                            </div>
                        </div>

                        <div class="keyboard-hints" id="dynamic-hints">
                            <!-- Rempli en JS -->
                        </div>
                    </div>

                    <!-- Mot demandé et saisie en BAS -->
                    <div id="drill-word-wrapper" style="display: flex; align-items: flex-start; justify-content: center; gap: 0.5rem; margin-bottom: 1.5rem; flex-wrap: wrap;">
                        <div class="word-source" id="drill-word-source" style="margin-bottom: 0;">...</div>
                        <div style="display: flex; gap: 0.35rem; margin-top: 0.35rem;">
                            <span id="drill-word-type-badge" class="type-badge hidden" style="font-size: 0.6rem; padding: 0.15rem 0.45rem;">nom</span>
                            <span id="drill-word-level-badge" class="type-badge hidden" style="font-size: 0.6rem; padding: 0.15rem 0.45rem;">A1</span>
                        </div>
                    </div>
                    
                    <div class="input-section" id="drill-input-wrapper">
                        <input type="text" id="drill-input" data-i18n-placeholder="placeholder_translation" placeholder="Traduction..." autocomplete="off">
                    </div>
                </div>
                
                <!-- Actions mobiles unifiées (Saisie & Résultat) -->
                <div id="mobile-action-container" style="display: none; width: 100%; margin-top: auto; flex-direction: column; gap: 0.5rem;">
                    <button id="btn-mobile-secondary" class="btn-drill-action btn-secondary-action" style="width: 100%; padding: 0.8rem; font-size: 1.1rem; justify-content: center; visibility: hidden; border-radius: 8px;">À revoir</button>
                    <button id="btn-mobile-primary" class="btn-primary" style="width: 100%; padding: 0.8rem; font-size: 1.1rem; justify-content: center; border-radius: 8px; border: none; font-weight: 600;">Vérifier</button>
                </div>
            </div>
        </div>
    </template>

    <!-- Template Vue Progression -->
    <template id="view-progress">
        <div class="view-content animate-fade-in">
            <h1 class="page-title" data-i18n="title_progress">Mes mots</h1>
            <p class="page-subtitle" data-i18n="subtitle_progress">Gérez les mots que vous maîtrisez ou que vous souhaitez réviser.</p>
            
            <div class="card progress-card" id="progress-empty-state" style="display: none; text-align: center; flex-direction: column; align-items: center; justify-content: center; gap: 1rem;">
                <p class="empty-text" style="font-weight: 600; font-size: 1.2rem; color: var(--text-secondary);" data-i18n="empty_progress">Aucun historique d'entraînement trouvé.</p>
                <p class="empty-subtext" style="color: var(--text-secondary); max-width: 400px;" data-i18n="empty_progress_sub">Veuillez d'abord démarrer une session pour voir votre progression.</p>
                <button id="btn-go-to-training" class="btn-primary" style="margin-top: 1rem; max-width: 250px;" data-i18n="btn_start_training">Démarrer un entraînement</button>
            </div>

            <div id="progress-content">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; flex-wrap: wrap; gap: 1rem;">
                    <select id="prog-lang-pair" style="width: auto; min-width: 250px; max-width: 400px; padding: 0.8rem 1rem; border-radius: 8px; font-weight: 600; margin: 0;">
                        <!-- Rempli dynamiquement -->
                    </select>
                    <button id="btn-toggle-all-visible" class="btn-small btn-secondary-action" style="white-space: nowrap; height: 48px; font-size: 0.95rem; padding: 0 1.25rem; margin: 0;" data-i18n="btn_reset_all">Tout Réinitialiser</button>
                </div>

                <div class="card progress-card" id="progress-main-card">
                    <div class="progress-filters" style="display: flex; gap: 1.25rem; align-items: center; justify-content: flex-start; margin-bottom: 1.5rem; flex-wrap: wrap; background: transparent; padding: 0; border: none;">
                        <input type="text" id="prog-search" data-i18n-placeholder="placeholder_search" placeholder="Rechercher un mot..." style="width: 250px; max-width: 100%; margin-bottom: 0;">
                        
                        <div class="type-filter-group" style="display: flex; gap: 0.85rem; align-items: center; flex-wrap: wrap;">
                            <label class="filter-checkbox-label" style="display: flex; align-items: center; gap: 0.4rem; cursor: pointer; user-select: none; margin: 0;">
                                <input type="checkbox" id="filter-type-nom" checked style="accent-color: #60a5fa; width: 15px; height: 15px; cursor: pointer;">
                                <span class="type-badge nom" style="font-size: 0.7rem; padding: 0.15rem 0.45rem; text-transform: uppercase;">Nom</span>
                            </label>
                            <label class="filter-checkbox-label" style="display: flex; align-items: center; gap: 0.4rem; cursor: pointer; user-select: none; margin: 0;">
                                <input type="checkbox" id="filter-type-verbe" checked style="accent-color: #fb7185; width: 15px; height: 15px; cursor: pointer;">
                                <span class="type-badge verbe" style="font-size: 0.7rem; padding: 0.15rem 0.45rem; text-transform: uppercase;">Verbe</span>
                            </label>
                            <label class="filter-checkbox-label" style="display: flex; align-items: center; gap: 0.4rem; cursor: pointer; user-select: none; margin: 0;">
                                <input type="checkbox" id="filter-type-adjectif" checked style="accent-color: #34d399; width: 15px; height: 15px; cursor: pointer;">
                                <span class="type-badge adjectif" style="font-size: 0.7rem; padding: 0.15rem 0.45rem; text-transform: uppercase;">Adjectif</span>
                            </label>
                            <label class="filter-checkbox-label" style="display: flex; align-items: center; gap: 0.4rem; cursor: pointer; user-select: none; margin: 0;">
                                <input type="checkbox" id="filter-type-adverbe" checked style="accent-color: #fbbf24; width: 15px; height: 15px; cursor: pointer;">
                                <span class="type-badge adverbe" style="font-size: 0.7rem; padding: 0.15rem 0.45rem; text-transform: uppercase;">Adverbe</span>
                            </label>
                            <label class="filter-checkbox-label" style="display: flex; align-items: center; gap: 0.4rem; cursor: pointer; user-select: none; margin: 0;">
                                <input type="checkbox" id="filter-type-conjonction" checked style="accent-color: #22d3ee; width: 15px; height: 15px; cursor: pointer;">
                                <span class="type-badge conjonction" style="font-size: 0.7rem; padding: 0.15rem 0.45rem; text-transform: uppercase;">Conjonction</span>
                            </label>
                        </div>
                        
                        <div class="level-filter-group" style="display: flex; gap: 0.85rem; align-items: center; flex-wrap: wrap;">
                            <label class="filter-checkbox-label" style="display: flex; align-items: center; gap: 0.4rem; cursor: pointer; user-select: none; margin: 0;">
                                <input type="checkbox" id="filter-level-a1" checked style="accent-color: var(--primary-color); width: 15px; height: 15px; cursor: pointer;">
                                <span class="type-badge" style="font-size: 0.7rem; padding: 0.15rem 0.45rem; background: rgba(59, 130, 246, 0.2); color: #3b82f6;">A1</span>
                            </label>
                            <label class="filter-checkbox-label" style="display: flex; align-items: center; gap: 0.4rem; cursor: pointer; user-select: none; margin: 0;">
                                <input type="checkbox" id="filter-level-a2" checked style="accent-color: var(--primary-color); width: 15px; height: 15px; cursor: pointer;">
                                <span class="type-badge" style="font-size: 0.7rem; padding: 0.15rem 0.45rem; background: rgba(16, 185, 129, 0.2); color: #10b981;">A2</span>
                            </label>
                            <label class="filter-checkbox-label" style="display: flex; align-items: center; gap: 0.4rem; cursor: pointer; user-select: none; margin: 0;">
                                <input type="checkbox" id="filter-level-b1" checked style="accent-color: var(--primary-color); width: 15px; height: 15px; cursor: pointer;">
                                <span class="type-badge" style="font-size: 0.7rem; padding: 0.15rem 0.45rem; background: rgba(245, 158, 11, 0.2); color: #f59e0b;">B1</span>
                            </label>
                            <label style="display: flex; align-items: center; gap: 0.35rem; font-size: 0.9rem; cursor: pointer;">
                                <input type="checkbox" id="filter-level-b2" checked style="accent-color: var(--primary-color); width: 15px; height: 15px; cursor: pointer;">
                                <span class="type-badge" style="font-size: 0.7rem; padding: 0.15rem 0.45rem; background: rgba(239, 68, 68, 0.2); color: #ef4444;">B2</span>
                            </label>
                            <label style="display: flex; align-items: center; gap: 0.35rem; font-size: 0.9rem; cursor: pointer;">
                                <input type="checkbox" id="filter-level-c1" checked style="accent-color: var(--primary-color); width: 15px; height: 15px; cursor: pointer;">
                                <span class="type-badge" style="font-size: 0.7rem; padding: 0.15rem 0.45rem; background: rgba(139, 92, 246, 0.2); color: #8b5cf6;">C1</span>
                            </label>
                        </div>
                    </div>

                <div class="table-container">
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th style="width: 25%;" data-i18n="th_source">Mot Source</th>
                                <th style="width: 25%;" data-i18n="th_translation">Traduction</th>
                                <th style="width: 20%; white-space: nowrap;" data-i18n="th_type">Catégorie</th>
                                <th style="width: 15%; text-align: center; white-space: nowrap;" data-i18n="th_level">Niveau</th>
                                <th style="width: 15%; text-align: center; white-space: nowrap;" data-i18n="th_status">Statut</th>
                            </tr>
                        </thead>
                        <tbody id="prog-table-body">
                            <!-- Rempli dynamiquement -->
                        </tbody>
                    </table>
                </div>
                </div>
            </div>
        </div>
    </template>

    <!-- Template Vue Stats -->
    <template id="view-stats">
        <div class="view-content animate-fade-in">
            <h1 class="page-title" data-i18n="title_stats">Statistiques</h1>
            <p class="page-subtitle" data-i18n="subtitle_stats">Suivez votre progression globale par paire de langues.</p>
            
            <div class="card stats-card" id="stats-empty-state" style="display: none; text-align: center; flex-direction: column; align-items: center; justify-content: center; gap: 1rem; padding: 2rem;">
                <p class="empty-text" style="font-weight: 600; font-size: 1.2rem; color: var(--text-secondary);" data-i18n="empty_stats">Aucune statistique disponible.</p>
                <p class="empty-subtext" style="color: var(--text-secondary); max-width: 400px;" data-i18n="empty_stats_sub">Veuillez d'abord démarrer une session pour générer des données.</p>
                <button id="btn-stats-go-to-training" class="btn-primary" style="margin-top: 1rem; max-width: 250px;" data-i18n="btn_start_training">Démarrer un entraînement</button>
            </div>

            <div class="stats-grid" id="stats-container">
                <!-- Rempli dynamiquement -->
            </div>
        </div>
    </template>
    <!-- Template Vue Certificats -->
    <template id="view-certs">
        <div class="view-content animate-fade-in">
            <h1 class="page-title" data-i18n="title_certs">Mes Certificats</h1>
            <p class="page-subtitle" data-i18n="subtitle_certs">Célébrez vos progrès et générez vos certificats drillFlow personnalisés pour couronner vos succès ! 🏆🎉</p>
            
            <div class="card cert-profile-card" style="margin-bottom: 1.5rem; display: flex; gap: 1.5rem; align-items: center; justify-content: flex-start; flex-wrap: wrap; padding: 1.25rem;">
                <div class="form-group" style="margin-bottom: 0; flex: 1 1 200px; text-align: left; display: flex; flex-direction: column; gap: 0.35rem;">
                    <label data-i18n="label_firstname" style="font-size: 0.85rem; font-weight: 600; color: var(--text-secondary);">Prénom</label>
