<!DOCTYPE html>
<html lang="fr" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="assets/icons/icon-192.png">
    <title>drillFlow — Words Manager (Tableur)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&family=Inter:wght@400;500;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="css/style.css?v=206">
    <link rel="stylesheet" href="css/words-manager.css?v=206">
</head>

<body>
    <div class="wm-app">
        <!-- Barre de navigation supérieure -->
        <header class="wm-header">
            <div class="wm-brand">
                <h1 class="wm-title">
                    <span class="logo-text"><span class="logo-white">drill</span><span
                            class="logo-blue">Flow.</span></span>
                    <span class="wm-badge">WORDS MANAGER</span>
                </h1>
            </div>

            <div class="wm-nav-links">
                <a href="report.html" class="wm-nav-btn">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"></path>
                        <line x1="12" y1="9" x2="12" y2="13"></line>
                        <line x1="12" y1="17" x2="12.01" y2="17"></line>
                    </svg>
                    Signalements
                </a>
                <a href="config.html" class="wm-nav-btn">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="3"></circle>
                        <path
                            d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z">
                        </path>
                    </svg>
                    Configuration
                </a>
                <a href="index.html" class="wm-nav-btn btn-primary">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                        <polyline points="9 22 9 12 15 12 15 22"></polyline>
                    </svg>
                    Site
                </a>
            </div>
        </header>

        <!-- Barre d'outils et de filtres réactifs -->
        <div class="wm-toolbar">
            <div class="wm-tools-left">
                <!-- Recherche globale instantanée -->
                <div class="wm-search-wrapper">
                    <svg class="wm-search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="11" cy="11" r="8"></circle>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                    </svg>
                    <input type="text" id="wm-search-input" class="wm-search-input"
                        placeholder="Rechercher un mot, traduction, exemple..." autocomplete="off">
                    <button type="button" class="wm-search-clear" id="wm-search-clear" title="Effacer la recherche" style="display: none;">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="18" y1="6" x2="6" y2="18"></line>
                            <line x1="6" y1="6" x2="18" y2="18"></line>
                        </svg>
                    </button>
                </div>

                <!-- Filtre Niveau CEFR -->
                <select id="wm-filter-level" class="wm-select" title="Filtrer par niveau CEFR">
                    <option value="">Tous les niveaux</option>
                    <option value="A1">A1</option>
                    <option value="A2">A2</option>
                    <option value="B1">B1</option>
                    <option value="B2">B2</option>
                    <option value="C1">C1</option>
                    <option value="C2">C2</option>
                </select>

                <!-- Filtre Type Grammatical -->
                <select id="wm-filter-type" class="wm-select" title="Filtrer par type grammatical">
                    <option value="">Tous les types</option>
                    <option value="nom">Noms</option>
                    <option value="verbe">Verbes</option>
                    <option value="adjectif">Adjectifs</option>
                    <option value="adverbe">Adverbes</option>
                    <option value="expression">Expressions</option>
                    <option value="autre">Autres</option>
                </select>

                <!-- Filtre d'état -->
                <select id="wm-filter-status" class="wm-select" title="Filtrer par statut">
                    <option value="">Tous les mots</option>
                    <option value="modified">Mots modifiés localement</option>
                    <option value="missing_ex">Sans exemple</option>
                </select>

                <!-- Sélecteur de colonnes -->
                <div class="wm-dropdown">
                    <button type="button" id="wm-btn-columns" class="wm-nav-btn">
                        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect width="18" height="18" x="3" y="3" rx="2"></rect>
                            <path d="M9 3v18"></path>
                            <path d="M15 3v18"></path>
                        </svg>
                        Colonnes ▾
                    </button>
                    <div id="wm-columns-menu" class="wm-dropdown-menu hidden">
                        <!-- Généré dynamiquement en JS -->
                    </div>
                </div>
            </div>

            <div class="wm-tools-right">
                <!-- Bouton Rafraîchir -->
                <button type="button" id="wm-btn-refresh" class="wm-nav-btn" title="Rafraîchir les données">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path>
                        <path d="M3 3v5h5"></path>
                        <path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"></path>
                        <path d="M16 21h5v-5"></path>
                    </svg>
                    Rafraîchir
                </button>

                <!-- Statut de sauvegarde auto -->
                <div id="wm-status" class="wm-status-indicator">
                    <div id="wm-status-dot" class="wm-status-dot"></div>
                    <span id="wm-status-text">Sauvegardé</span>
                </div>

                <!-- Compteur de mots filtrés / total -->
                <span id="wm-count" class="wm-count-info">8 850 mots</span>

                <!-- Bouton Réinitialiser les modifications locales -->
                <button type="button" id="wm-btn-reset" class="wm-nav-btn"
                    title="Annuler les modifications locales non exportées" style="display: none;">
                    ↺ Annuler
                </button>

                <!-- Bouton Export vocabulary.js -->
                <button type="button" id="wm-btn-export" class="wm-nav-btn btn-primary"
                    title="Télécharger vocabulary.js à jour avec vos modifications">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                        <polyline points="7 10 12 15 17 10"></polyline>
                        <line x1="12" y1="15" x2="12" y2="3"></line>
                    </svg>
                    Exporter
                </button>
            </div>
        </div>

        <!-- Zone du tableau virtualisé avec marges alignées -->
        <main class="wm-grid-container">
            <div class="wm-grid-card">
                <!-- En-tête fixe -->
                <div id="wm-table-header" class="wm-table-header">
                    <!-- Généré dynamiquement en JS selon colonnes actives -->
                </div>

                <!-- Viewport scrollable virtualisé -->
                <div id="wm-viewport" class="wm-viewport">
                    <div id="wm-virtual-canvas" class="wm-virtual-canvas">
                        <!-- Les lignes visibles sont injectées ici dynamiquement -->
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Écran de contrôle d'accès Administrateur -->
    <div id="wm-auth-overlay" class="wm-auth-overlay hidden">
        <div class="wm-auth-card">
            <div class="wm-auth-icon">
                <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <rect width="18" height="11" x="3" y="11" rx="2" ry="2"></rect>
                    <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                </svg>
            </div>
            <h2 class="wm-auth-title">Accès Administrateur</h2>
            <p class="wm-auth-desc">Cette page permet d'éditer la base lexicale de drillFlow. Connectez-vous avec
                votre compte administrateur pour déverrouiller le Words Manager.</p>
            <form id="wm-auth-form" style="display: flex; flex-direction: column; gap: 0.85rem;">
                <input type="email" id="wm-auth-email" class="wm-auth-input" placeholder="Adresse e-mail"
                    autocomplete="username" autofocus>
                <input type="password" id="wm-auth-input" class="wm-auth-input" placeholder="Mot de passe"
                    autocomplete="current-password">
                <p id="wm-auth-error" class="wm-auth-error" style="display: none;"></p>
                <button type="submit" class="wm-auth-btn">Se connecter</button>
            </form>
        </div>
    </div>

    <script type="module" src="js/words-manager.js?v=206"></script>
    <script>
        if ("serviceWorker" in navigator) {
            window.addEventListener("load", () => {
                navigator.serviceWorker.register("/service-worker.js");
            });
        }
    </script>
</body>

</html>
