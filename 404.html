<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Redirection...</title>
    <script>
        // Interception automatique de tous les liens d'action Firebase et routes directes
        const params = new URLSearchParams(window.location.search);
        const path = window.location.pathname.replace(/\/+$/, '').toLowerCase();
        if (path === '/config') {
            window.location.replace('/config/' + window.location.search);
        } else if (path === '/admin') {
            window.location.replace('/admin.html' + window.location.search);
        } else if (params.has('mode') && params.has('oobCode')) {
            window.location.replace('auth-action.html' + window.location.search);
        } else {
            window.location.replace('index.html');
        }
    </script>
</head>
<body style="background: #0b1120; color: #fff; font-family: sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0;">
    <p>Redirection vers drillFlow. en cours...</p>
</body>
</html>
